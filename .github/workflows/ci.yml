# Her PR ve main'e her push: konu kontrolü, testler, tip kontrolü, build.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run kontrol
      - run: npm test
      - run: npm run typecheck
      - run: npx astro build
